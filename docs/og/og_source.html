<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ── og:image 만드는 원본 (SITE-52 §3 · 2026-09-25) ───────────────────────────
     🔴 **공개되지 않는다** — `_redirects` 가 `/docs/*` 를 첫 화면으로 301 시킨다(SITE-39).
     🔴 **새 그림을 그리지 않았다** — 북극성(`northstar.svg`)과 대운 그래프(`site_01_hero_graph.png`)는
        이미 사이트에 있던 그림이고, 색은 `style.css` 의 `--ink` · `--gold` · `--paper` 그대로다.
        🔴 **토큰을 바꾸지 않았다. 여기서 값을 다시 적은 것은 이 파일이 style.css 를 안 읽기 때문이다**
        (읽게 하면 글꼴 92개까지 딸려 와 1200×630 한 장을 찍는 데 과하다).
     🔴 **손님 정보 0** — 대운 그래프는 앱 화면이고 이름·생년월일이 없다(이미 첫 화면에 쓰던 그림이다).
     글자: 「JINAZEN」(브랜드) · 「진아젠 운세그래프」(앱 이름) · 소유자 문안 제목의 뒷마디.
     다시 만들 때:
       python .venv/bin/python scripts 없이 — Playwright 로 이 파일을 1200×630 으로 찍는다.
       (이번에 쓴 명령은 `docs/tasks/TASK-SITE-52-CUSTOMER-FIX-1.md` §3 에 적어 두었다) -->
<style>
  /* 값 출처: assets/style.css `:root` — --ink #111 · --gold #C5A15B · --paper #FFF · --f */
  @font-face{font-family:'Pretendard Variable';src:url(../../assets/font/PretendardVariable.woff2) format('woff2-variations');font-weight:45 920;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#111;color:#FFF;overflow:hidden;
       font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;
       display:grid;grid-template-columns:1fr 470px;align-items:center;gap:40px;padding:64px 72px}
  /* 🔴 북극성은 `--ink` 로 그려진 그림이라 검정 바탕에서 안 보인다 — 흰색으로 뒤집는다(값을 안 바꾸고 칠만).
     ⚠ 실측: 뒤집기 전에는 왼쪽 위가 거의 비어 보였다. */
  .mark{width:84px;height:84px;filter:brightness(0) invert(1);opacity:.92}
  .brand{margin-top:22px;font-size:68px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .app{margin-top:16px;font-size:27px;font-weight:600;color:#C5A15B;letter-spacing:-.02em}
  .line{margin-top:20px;font-size:25px;font-weight:400;color:rgba(255,255,255,.80);line-height:1.5;letter-spacing:-.02em;word-break:keep-all}
  /* 🔴 아래가 잘리지 않게 칸 안에 담는다 — 잘리면 표가 반쯤 보여 무엇인지 안 읽힌다(실측). */
  .shot{width:100%;max-height:502px;object-fit:contain;object-position:top;border-radius:18px;
        filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
</style>
</head>
<body>
<div>
  <img class="mark" src="../../assets/img/northstar.svg" alt="">
  <div class="brand">JINAZEN</div>
  <div class="app">진아젠 운세그래프</div>
  <div class="line">사주 · 자미두수 · 타로로 읽는<br>나의 운세그래프</div>
</div>
<div><img class="shot" src="../../assets/img/site_01_hero_graph.png" alt=""></div>
</body></html>
